name: Publiser web-app (PWA)

# Bygger web-versjonen og publiserer den på GitHub Pages hver gang koden endres, eller manuelt fra Actions-fanen.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typesjekk
        run: npx tsc --noEmit

      - name: Bygg web-versjonen
        run: npx expo export --platform web --output-dir dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lag ikoner
        run: pip install pillow && python scripts/icons.py

      - name: Gjør om til PWA
        run: node scripts/pwa.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
